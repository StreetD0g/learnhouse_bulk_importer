name: learnhouse-course-importer

services:
  importer:
    build: .
    container_name: learnhouse-course-importer
    restart: unless-stopped
    ports:
      - "8099:8000"

    # Betreiber tragen diese Werte direkt hier oder in der ZimaOS/CasaOS-UI ein.
    # Die Platzhalter verhindern einen Start, bis sie ersetzt wurden.
    environment:
      IMPORT_ROOT: "/imports"
      DATA_DIR: "/data"
      IMPORTER_USER: "admin"
      IMPORTER_PASSWORD: "CHANGE_ME_TO_A_LONG_UNIQUE_PASSWORD"
      SESSION_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SESSION_SECRET"
      COOKIE_SECURE: "false"
      # Standard: öffentliche HTTPS-Adresse. Für eine direkte lokale Docker-
      # Verbindung siehe docker-compose.local.yml.example.
      LEARNHOUSE_URL: "https://learn.example.com"
      # Rückfallwerte für ein einzelnes Token. Bei mehreren Zielen stehen URL,
      # ID und Slug nummeriert in ./config/learnhouse-importer.env.
      LEARNHOUSE_ORG_ID: "1"
      LEARNHOUSE_ORG_SLUG: "default"
      LEARNHOUSE_TOKEN_FILE: "/config/learnhouse-importer.env"
      IMPORT_WORKERS: "1"

    volumes:
      - ./imports:/imports:ro
      - importer_data:/data
      # Beim ersten Start erstellt der Container hier eine leere Token-Datei.
      - ./config:/config

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

x-casaos:
  id: io.github.streetd0g.learnhouse-course-importer
  main: importer
  index: /
  port_map: "8099"
  scheme: http
  title:
    en_US: LearnHouse Course Importer
    de_DE: LearnHouse Course Importer
  tagline:
    en_US: Import local course folders into LearnHouse
    de_DE: Importiert lokale Kursordner in LearnHouse
  description:
    en_US: A self-hosted bulk course importer for LearnHouse.
    de_DE: Ein self-hosted Bulk-Importer für LearnHouse-Kurse.
  category: Education
  architectures:
    - amd64

volumes:
  importer_data:
